{% extends "base.html" %}

{% block head_title %}Search{% endblock %}

{% block content %}
<div class="container mt-5">
  <h2>Search Blog Posts</h2>
  <form method="get" action="{% url 'core:search' %}" class="form-group">
    <input type="text" class="form-control" name="q" placeholder="Search..." value="{{ query }}">
    <button type="submit" class="btn btn-primary mt-2">Search</button>
  </form>

  {% if query %}
    <p>You searched for: {{ query }}</p>  <!-- safe by default: Django auto-escapes this -->
    <ul>
      {% for post in posts %}
        <li><a href="{% url 'core:post' post.id post.slug %}">{{ post.title }}</a></li>
      {% empty %}
        <li>No posts found.</li>
      {% endfor %}
    </ul>
  {% endif %}
</div>
{% endblock %}
